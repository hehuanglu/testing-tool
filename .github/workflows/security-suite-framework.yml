name: Standalone security suite framework

on:
  pull_request:
    paths:
      - '.github/workflows/security-suite-framework.yml'
      - 'tests/security/security_framework/**'
      - 'tests/security/suites/**'
      - 'tests/security/feasibility/**'
      - 'tests/security/test_security_framework.py'
      - 'tests/security/zap-image.txt'
      - 'tests/security/zap_report.py'
  push:
    branches: [codex/security-framework-p2]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  framework-example:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      PYTHONPATH: tests/security
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13.2'
      - name: Verify the runner contract
        run: python3 -m unittest discover -s tests/security -p 'test_security_framework.py'
      - name: Pull the pinned ZAP image
        run: docker pull "$(cat tests/security/zap-image.txt)"
      - name: Record the fixture runtime
        run: |
          image=$(cat tests/security/zap-image.txt)
          os=$(docker image inspect --format '{{.Os}}' "$image")
          arch=$(docker image inspect --format '{{.Architecture}}' "$image")
          test "$os/$arch" = linux/amd64
          manifest=$(docker buildx imagetools inspect --raw "$image" |
            jq -er --arg arch "$arch" '.manifests | map(select(.platform.os == "linux" and .platform.architecture == $arch)) | if length == 1 then .[0].digest else error("platform manifest") end')
          mkdir -p artifacts/security-suite/feasibility_fixture
          jq -n --arg revision "$(git rev-parse HEAD)" --arg runner "$RUNNER_OS/$RUNNER_ARCH" \
            --arg runnerImage "${ImageOS:-unknown}/${ImageVersion:-unknown}" \
            --arg os "$(cat /etc/os-release | sed -n 's/^PRETTY_NAME=//p' | tr -d '"')" \
            --arg python "$(python3 --version)" --arg docker "$(docker version --format '{{.Server.Version}}')" \
            --arg image "$image" --arg id "$(docker image inspect --format '{{.Id}}' "$image")" \
            --arg platform "$os/$arch" --arg manifest "$manifest" \
            '{revision: $revision, runner: $runner, runnerImage: $runnerImage, os: $os, python: $python,
              dockerServer: $docker, image: $image, imageId: $id, platform: $platform, platformManifest: $manifest}' \
            > artifacts/security-suite/feasibility_fixture/runtime.json
      - name: Qualify fixture outcomes and evidence controls
        run: |
          root=artifacts/security-suite/feasibility_fixture
          failed=0
          for lane in baseline public-csp-regression missing-evidence invalid-evidence active-blocked; do
            case "$lane" in
              baseline) expected=0; status=PASS; reason=ASSERTIONS_SATISFIED; classification=COMPLETED ;;
              public-csp-regression) expected=1; status=FAIL; reason=CSP_REGRESSION; classification=COMPLETED ;;
              missing-evidence) expected=2; status=ERROR; reason=MISSING_EVIDENCE; classification=INCOMPLETE ;;
              invalid-evidence) expected=2; status=ERROR; reason=INVALID_EVIDENCE; classification=INCOMPLETE ;;
              active-blocked) expected=3; status=BLOCKED; reason=ACTIVE_EXECUTION_RESTRICTED; classification=BLOCKED ;;
            esac
            out="$root/$lane"
            code=0
            python3 -m security_framework.run --suite feasibility_fixture --scenario "$lane" --out "$out" || code=$?
            if ! python3 -m security_framework.ci --out "$out/receipt.json" --exit-code "$code" \
                shared "$out/result.json" --framework-revision "$GITHUB_SHA"; then
              failed=1
              continue
            fi
            if ! test "$code" = "$expected" ||
              ! jq -e --arg status "$status" --arg reason "$reason" '
                .verdict == $status and (.decisiveChecks | any(. == $reason))
                  and (if $status == "BLOCKED" then
                    (.evidence | length == 1 and all(.[]; .producer == "capability-boundary"
                      and .data == {"dispatched": false, "reason": $reason}))
                  else true end)' "$out/result.json" ||
              ! jq -e --arg state "$classification" '
                .execution.status == $state and .acceptance.status == "NOT_EVALUATED"' "$out/receipt.json"; then
              failed=1
            fi
          done
          exit "$failed"
      - name: Verify owned fixture teardown
        if: ${{ always() && hashFiles('artifacts/security-suite/feasibility_fixture/*/result.json') != '' }}
        run: |
          root=artifacts/security-suite/feasibility_fixture
          for result in "$root"/*/result.json; do
            run_id=$(jq -er '.runId | select(test("^[a-f0-9]{32}$"))' "$result")
            remaining=$(docker ps -aq --filter "name=^/security-suite-$run_id$")
            test -z "$remaining"
          done
          printf '{"ownedContainersAbsent":true}\n' > "$root/teardown.json"
      - name: Stage validated projections
        if: ${{ always() && hashFiles('artifacts/security-suite/feasibility_fixture/*/receipt.json') != '' }}
        run: |
          src=artifacts/security-suite/feasibility_fixture
          dst=artifacts/security-suite/publish
          mkdir -p "$dst"
          cp "$src/runtime.json" "$dst/"
          if test -s "$src/teardown.json"; then cp "$src/teardown.json" "$dst/"; fi
          for receipt in "$src"/*/receipt.json; do
            lane_dir=$(dirname "$receipt")
            lane=$(basename "$lane_dir")
            jq -e '.schemaVersion == 2' "$receipt" >/dev/null
            mkdir "$dst/$lane"
            cp "$lane_dir/"{receipt.json,result.json,report.md} "$dst/$lane/"
          done
      - name: Upload projected evidence and report
        if: ${{ always() && hashFiles('artifacts/security-suite/publish/*/receipt.json') != '' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: security-suite-example-${{ github.run_attempt }}
          path: |
            artifacts/security-suite/publish/runtime.json
            artifacts/security-suite/publish/teardown.json
            artifacts/security-suite/publish/*/receipt.json
            artifacts/security-suite/publish/*/result.json
            artifacts/security-suite/publish/*/report.md
          if-no-files-found: error
          retention-days: 7
