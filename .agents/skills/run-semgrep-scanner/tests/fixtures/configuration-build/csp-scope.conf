http {
  # ruleid: config-nginx-csp-scope-review-v2
  add_header Content-Security-Policy "default-src self" always;
  # ruleid: config-nginx-csp-scope-review-v2
  server {
    listen 80;
    location / {
      # A child header needs inheritance review; parent CSP alone is insufficient.
      # ruleid: config-nginx-csp-scope-review-v2
      add_header X-Frame-Options SAMEORIGIN;
    }
    location /unknown {
      # ruleid: config-nginx-csp-scope-review-v2
      include unavailable-headers.conf;
    }
  }
  # CSP on this server does not establish headers on the next server.
  # ruleid: config-nginx-csp-scope-review-v2
  server {
    # ruleid: config-nginx-csp-scope-review-v2
    add_header Content-Security-Policy "default-src self";
  }
  # ruleid: config-nginx-csp-scope-review-v2
  server {
    listen 8080;
  }
  # ok: config-nginx-csp-scope-review-v2
  keepalive_timeout 65;
}
