    languages:
      - typescript
    metadata:
      category: security
      confidence: MEDIUM
      technology:
        - nestjs
        - nodejs
      p2_semantics: p2-manual-ce-2026-10-23
    pattern-either:
      - patterns:
          - pattern-inside: "import * as $API from \"child_process\";\n..."
          - pattern: $API.$METHOD($COMMAND, ...)
          - metavariable-regex:
              metavariable: $METHOD
              regex: ^(?:exec|execSync)$
      - patterns:
          - pattern-inside: "import $API from \"child_process\";\n..."
          - pattern: $API.$METHOD($COMMAND, ...)
          - metavariable-regex:
              metavariable: $METHOD
              regex: ^(?:exec|execSync)$
