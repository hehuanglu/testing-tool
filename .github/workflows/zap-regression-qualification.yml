name: ZAP regression qualification

on:
  pull_request:
  push:
    branches:
      - codex/zap-regression-generator
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qualification:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: .agents/skills/mcp-zap-repo-operations/lib/zap-product-assessment/requirements.lock
      - name: Install locked exporter dependencies
        run: python -m pip install -r .agents/skills/mcp-zap-repo-operations/lib/zap-product-assessment/requirements.lock
      - name: Run exporter contract tests
        env:
          PYTHONPATH: .agents/skills/mcp-zap-repo-operations/lib/zap-product-assessment/src
        run: python -m unittest discover -s .agents/skills/mcp-zap-repo-operations/lib/zap-product-assessment/tests -p test_regression_export.py -v
      - name: Run portable runtime unit tests
        run: python -m unittest discover -s tests/security -p 'test_zap*.py' -v
      - name: Run real ZAP controls
        run: python tests/security/qualification/run_acceptance.py --scenario all --out artifacts/qualification
      - name: Upload qualification artifact
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: zap-regression-qualification-${{ github.job }}-${{ github.run_attempt }}
          path: artifacts/qualification
          if-no-files-found: warn
          retention-days: 7
