interface:
  display_name: "MCP ZAP Repo Operations"
  short_description: "Assess project security catalogs into a Drive table"
  default_prompt: "Use $mcp-zap-repo-operations with the project and authoritative security catalog: assign one preparation subagent to reconnaissance/catalog normalization and, after catalog approval, plan drafting. The main agent audits each draft with situation-dependent questions and requires revisions until it passes internal review before the corresponding user approval gate. Select explicit model and reasoning settings per the delegation policy. Then autonomously adapt testing within scope, finish all cases using compatible evidence and local continuation, and deliver the agreed eleven-column Google Sheets table on Drive with risk counts, Only observed, evidence for each finding and explanatory notes."
