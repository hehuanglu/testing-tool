rules:
  - id: config-docker-latest-tag
    message: Docker image uses the mutable latest tag. Pin an immutable version or digest.
    severity: WARNING
    languages: [generic]
    paths:
      include: ["**/Dockerfile", "**/*.yaml", "**/*.yml"]
    metadata:
      category: security
      confidence: HIGH
      technology: [docker]
    pattern-regex: '(?mi)^\s*(?:FROM|image:)\s+[^\s#]+:latest(?:\s|$)'

  - id: config-docker-root-user
    message: Dockerfile explicitly selects the root user.
    severity: WARNING
    languages: [generic]
    paths:
      include: ["**/Dockerfile"]
    metadata:
      category: security
      confidence: HIGH
      technology: [docker]
    pattern-regex: '(?mi)^\s*USER\s+(?:root|0)(?:\s|$)'

  - id: config-docker-remote-shell-install-v2
    message: Container build pipes a remote download into a shell. This installation observation is outside the default-permissions criterion.
    severity: ERROR
    languages: [generic]
    paths:
      include: ["**/Dockerfile"]
    metadata:
      category: security
      confidence: MEDIUM
      technology: [docker]
    pattern-regex: '(?mi)(?:curl|wget)[^\n|]*\|\s*(?:sh|bash)'

  - id: config-docker-world-writable-permissions-v2
    message: Container build explicitly sets world-writable permissions. Review the affected resource and resulting access configuration; default permissions are not established by syntax alone.
    severity: WARNING
    languages: [generic]
    paths:
      include: ["**/Dockerfile"]
    metadata:
      category: security
      confidence: MEDIUM
      technology: [docker]
    pattern-regex: '(?mi)\bchmod\s+(?:-R\s+)?777\b'

  - id: config-compose-privileged
    message: Compose enables privileged container execution.
    severity: ERROR
    languages: [generic]
    paths:
      include: ["**/compose.yaml", "**/compose.yml", "**/docker-compose.yaml", "**/docker-compose.yml"]
    metadata:
      category: security
      confidence: HIGH
      technology: [docker-compose]
    pattern-regex: '(?mi)^\s*privileged:\s*true\s*(?:#.*)?$'

  - id: config-compose-host-network
    message: Compose enables host networking.
    severity: ERROR
    languages: [generic]
    paths:
      include: ["**/compose.yaml", "**/compose.yml", "**/docker-compose.yaml", "**/docker-compose.yml"]
    metadata:
      category: security
      confidence: HIGH
      technology: [docker-compose]
    pattern-regex: '(?mi)^\s*network_mode:\s*["'']?host["'']?\s*(?:#.*)?$'

  - id: config-compose-docker-socket
    message: Compose service bind-mounts a conventional Docker socket path. If the daemon is reachable and
      permissions allow API access, container code may control that daemon; :ro alone does not make the socket
      API read-only.
    severity: WARNING
    languages:
      - yaml
    metadata:
      category: security
      confidence: MEDIUM
      technology:
        - docker-compose
      p2_semantics: p2-manual-ce-2026-10-23
    paths:
      include:
        - '**/compose.yaml'
        - '**/compose.yml'
        - '**/docker-compose.yaml'
        - '**/docker-compose.yml'
    pattern-either:
      - patterns:
          - pattern: '{services: {..., $SERVICE: {..., volumes: [..., $ITEM, ...], ...}, ...}, ...}'
          - metavariable-regex:
              metavariable: $ITEM
              regex: ^["\x27]?(?:/var/run|/run)/docker\.sock:[^\s"\x27]+["\x27]?$
      - pattern: '{services: {..., $SERVICE: {..., volumes: [..., {type: bind, source: /var/run/docker.sock, ...},
          ...], ...}, ...}, ...}'
      - pattern: '{services: {..., $SERVICE: {..., volumes: [..., {type: bind, source: /run/docker.sock, ...}, ...],
          ...}, ...}, ...}'

  - id: config-nginx-server-tokens-on
    message: nginx exposes version tokens.
    severity: WARNING
    languages: [generic]
    paths:
      include: ["**/*.conf"]
    metadata:
      category: security
      confidence: HIGH
      technology: [nginx]
    pattern-regex: '(?mi)^\s*server_tokens\s+on\s*;'

  - id: config-nginx-directory-listing-enabled-v2
    message: nginx explicitly enables directory listing. Review the applicable location and sensitive-directory access restrictions.
    severity: WARNING
    languages: [generic]
    paths:
      include: ["**/*.conf"]
    metadata:
      category: security
      confidence: HIGH
      technology: [nginx]
    pattern-regex: '(?mi)^\s*autoindex\s+on\s*;'

  - id: config-nginx-missing-content-security-policy
    message: An nginx server block does not visibly set a Content-Security-Policy header. Add a reviewed CSP appropriate for the frontend asset and API origins.
    severity: WARNING
    languages: [generic]
    paths:
      include: ["**/*.conf"]
    metadata:
      category: security
      confidence: MEDIUM
      technology: [nginx, browser]
    patterns:
      - pattern: |
          server {
            ...
          }
      - pattern-not: |
          server {
            ...
            add_header Content-Security-Policy ...;
            ...
          }

  - id: config-vite-production-sourcemap
    message: Vite build enables production source maps. Confirm source disclosure is intended.
    severity: WARNING
    languages: [generic]
    paths:
      include: ["**/vite.config.ts", "**/vite.config.js"]
    metadata:
      category: security
      confidence: MEDIUM
      technology: [vite]
    pattern-regex: '(?m)\bsourcemap\s*:\s*true\b'

  - id: config-package-unpinned-wildcard-dependency
    message: Dependency field uses a wildcard version. Review reproducible resolution and the lockfile; other package metadata is outside this detector.
    severity: WARNING
    languages:
      - json
    paths:
      include: ["**/package.json"]
    metadata:
      category: security
      confidence: HIGH
      technology: [npm]
      p1_semantics: p1-manual-ce-2026-10-23
    patterns:
      - pattern-either:
          - pattern: '{"dependencies": {..., $PACKAGE: $VERSION, ...}, ...}'
          - pattern: '{"devDependencies": {..., $PACKAGE: $VERSION, ...}, ...}'
          - pattern: '{"optionalDependencies": {..., $PACKAGE: $VERSION, ...}, ...}'
          - pattern: '{"peerDependencies": {..., $PACKAGE: $VERSION, ...}, ...}'
      - metavariable-regex:
          metavariable: $VERSION
          regex: ^["\x27]?\*["\x27]?$
  - id: config-package-remote-code-dependency
    message: Dependency field references a remote Git/HTTP source. Review immutable pinning and install behavior; metadata URLs are outside this detector.
    severity: WARNING
    languages:
      - json
    paths:
      include: ["**/package.json"]
    metadata:
      category: security
      confidence: HIGH
      technology: [npm]
      p1_semantics: p1-manual-ce-2026-10-23
    patterns:
      - pattern-either:
          - pattern: '{"dependencies": {..., $PACKAGE: $VERSION, ...}, ...}'
          - pattern: '{"devDependencies": {..., $PACKAGE: $VERSION, ...}, ...}'
          - pattern: '{"optionalDependencies": {..., $PACKAGE: $VERSION, ...}, ...}'
          - pattern: '{"peerDependencies": {..., $PACKAGE: $VERSION, ...}, ...}'
      - metavariable-regex:
          metavariable: $VERSION
          regex: ^["\x27]?(?:git\+|git://|https?://)
  - id: config-package-install-lifecycle-script
    message: package manifest defines an install-time lifecycle script. Review it as supply-chain execution.
    severity: WARNING
    languages: [generic]
    paths:
      include: ["**/package.json"]
    metadata:
      category: security
      confidence: HIGH
      technology: [npm]
    pattern-regex: '"(?:preinstall|install|postinstall)"\s*:'

