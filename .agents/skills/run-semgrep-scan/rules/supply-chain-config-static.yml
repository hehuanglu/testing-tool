  - id: config-cookie-secure-disabled
    message: Cookie secure explicitly uses a permissive value in cookie/session options. Review
      sensitive-cookie purpose, HTTPS/cross-site requirements and effective overrides; no conclusion follows
      from an omitted flag.
    severity: WARNING
    languages:
      - typescript
    metadata:
      category: security
      confidence: MEDIUM
      technology:
        - express
        - nestjs
      p2_semantics: p2-manual-ce-2026-10-23
    pattern-either:
      - patterns:
          - pattern: '$RES.cookie($NAME, $VALUE, {..., secure: false, ...})'
          - metavariable-regex:
              metavariable: $RES
              regex: ^(?:res|response|reply)$
      - patterns:
          - pattern-inside: "import $SESSION from \"express-session\";\n..."
          - pattern: '$SESSION({..., cookie: {..., secure: false, ...}, ...})'
      - patterns:
          - pattern-inside: "const $SESSION = require(\"express-session\");\n..."
          - pattern: '$SESSION({..., cookie: {..., secure: false, ...}, ...})'

