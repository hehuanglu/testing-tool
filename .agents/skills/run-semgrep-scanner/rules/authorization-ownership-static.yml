rules:
  - id: nestjs-ownership-client-user-id-to-service
    message: Request body/query/params ownership-named field is passed to a method. Review request origin and authoritative principal binding before concluding authorization trust.
    severity: WARNING
    languages: [typescript]
    metadata:
      category: security
      confidence: MEDIUM
      technology: [nestjs]
    patterns:
      - pattern-either:
          - pattern: $SERVICE.$METHOD(..., $REQUEST.body.$OWNER, ...)
          - pattern: $SERVICE.$METHOD(..., $REQUEST.query.$OWNER, ...)
          - pattern: $SERVICE.$METHOD(..., $REQUEST.params.$OWNER, ...)
      - metavariable-regex:
          metavariable: $OWNER
          regex: '(?i)^(?:user|owner|principal)(?:_?(?:id|ref|key))?$'

  - id: nestjs-ownership-user-id-field-in-dto
    message: DTO-suffixed class declares an ownership-named field. Determine request, response, shared or inherited usage through callers and serializers before treating the field as client input or authorization authority.
    severity: WARNING
    languages: [typescript]
    metadata:
      category: security
      confidence: MEDIUM
      technology: [nestjs]
    patterns:
      - pattern: |
          class $DTO {
            ...
            $OWNER: $TYPE;
            ...
          }
      - metavariable-regex:
          metavariable: $DTO
          regex: '(?i).*dto$'
      - metavariable-regex:
          metavariable: $OWNER
          regex: '(?i)^(?:user|owner|principal)_?(?:id|ref|key)$'

  - id: nestjs-ownership-id-only-find-one
    message: Identifier lookup is an ownership review candidate. Read all predicates and before-use server authorization; this pattern does not establish that ownership is missing.
    severity: WARNING
    languages: [typescript]
    metadata:
      category: security
      confidence: MEDIUM
      technology: [nestjs, typeorm]
    patterns:
      - pattern-either:
          - pattern: '$REPO.findOne({..., where: {$KEY: $ID}, ...})'
          - pattern: '$REPO.findOneBy({$KEY: $ID})'
          - pattern: '$REPO.findOneByOrFail({$KEY: $ID})'
          - pattern: '$REPO.findOneOrFail({..., where: {$KEY: $ID}, ...})'
      - metavariable-regex:
          metavariable: $KEY
          regex: (?i)^(?!(?:user|owner|principal)_?(?:id|ref|key)$)(?:[a-z][a-z0-9]*_?)?(?:id|ref|key)$
  - id: nestjs-ownership-unscoped-update-delete
    message: Mutation with identifier criteria is an ownership review candidate. Inspect all predicates, prior authorization and transaction scope before concluding BOLA.
    severity: WARNING
    languages: [typescript]
    metadata:
      category: security
      confidence: MEDIUM
      technology: [nestjs, typeorm]
    patterns:
      - pattern-either:
          - pattern: '$REPO.update({$KEY: $ID}, ...)'
          - pattern: '$REPO.delete({$KEY: $ID})'
          - pattern: '$MANAGER.delete($ENTITY, {$KEY: $ID})'
          - pattern: '$MANAGER.update($ENTITY, {$KEY: $ID}, ...)'
      - metavariable-regex:
          metavariable: $KEY
          regex: '(?i)^(?!(?:user|owner|principal)_?(?:id|ref|key)$)(?:[a-z][a-z0-9]*_?)?(?:id|ref|key)$'

  - id: nestjs-ownership-client-user-id-persistence
    message: Ownership-named property is copied from another object into an entity/create call. INPUT may be server-trusted; trace provenance before treating this as client control.
    severity: WARNING
    languages: [typescript]
    metadata:
      category: security
      confidence: LOW
      technology: [nestjs, typeorm]
    patterns:
      - pattern-either:
          - pattern: '$REPO.create({..., $OWNER: $INPUT.$OWNER, ...})'
          - pattern: '$ENTITY.$OWNER = $INPUT.$OWNER'
      - metavariable-regex:
          metavariable: $OWNER
          regex: '(?i)^(?:user|owner|principal)_?(?:id|ref|key)$'

  - id: nestjs-ownership-request-body-mass-assignment
    message: Request-body-shaped data is supplied to entity construction/persistence. Review DTO allowlists, mutable fields and authoritative ownership; create/merge alone need not write data.
    severity: WARNING
    languages: [typescript]
    metadata:
      category: security
      confidence: MEDIUM
      technology: [nestjs, typeorm, express]
    pattern-either:
      - pattern: $REPO.create($REQUEST.body)
      - pattern: $REPO.save($REQUEST.body)
      - pattern: $REPO.update($ID, $REQUEST.body)
      - pattern: $REPO.merge($ENTITY, $REQUEST.body)
  - id: nestjs-ownership-scalar-mutation-review
    message: ID-like argument reaches an update/delete-shaped method. Establish receiver provenance from imports, types, constructors and aliases; Map/Set and service wrappers also match. Review actual write and authorization before a persistence or BOLA claim.
    severity: WARNING
    languages:
      - typescript
    metadata:
      category: security
      confidence: MEDIUM
      technology:
        - nestjs
        - typeorm
    patterns:
      - pattern-either:
          - pattern: $R.update($ID, $DATA)
          - pattern: $R.delete($ID)
          - pattern: $M.update($ENTITY, $ID, $DATA)
          - pattern: $M.delete($ENTITY, $ID)
      - metavariable-regex:
          metavariable: $ID
          regex: (?i)^(?:[a-z][a-z0-9]*\.)*(?:[a-z][a-z0-9]*_?)?(?:id|ref|key)$
  - id: nestjs-ownership-bulk-criteria-review
    message: Identifier list/operator appears in persistence criteria. Review authorization for every selected record; extra criteria do not establish ownership.
    severity: WARNING
    languages:
      - typescript
    metadata:
      category: security
      confidence: MEDIUM
      technology:
        - nestjs
        - typeorm
    patterns:
      - pattern-either:
          - patterns:
              - pattern-either:
                  - pattern: '$R.findBy({..., $KEY: In($IDS), ...})'
                  - pattern: '$R.find({..., where: {..., $KEY: In($IDS), ...}, ...})'
                  - pattern: '$R.update({..., $KEY: In($IDS), ...}, ...)'
                  - pattern: '$R.delete({..., $KEY: In($IDS), ...})'
                  - pattern: '$M.update($ENTITY, {..., $KEY: In($IDS), ...}, ...)'
                  - pattern: '$M.delete($ENTITY, {..., $KEY: In($IDS), ...})'
                  - pattern: '$R.findBy({..., $KEY: Any($IDS), ...})'
                  - pattern: '$R.find({..., where: {..., $KEY: Any($IDS), ...}, ...})'
                  - pattern: '$R.update({..., $KEY: Any($IDS), ...}, ...)'
                  - pattern: '$R.delete({..., $KEY: Any($IDS), ...})'
                  - pattern: '$M.update($ENTITY, {..., $KEY: Any($IDS), ...}, ...)'
                  - pattern: '$M.delete($ENTITY, {..., $KEY: Any($IDS), ...})'
              - metavariable-regex:
                  metavariable: $KEY
                  regex: (?i)^(?!(?:user|owner|principal)_?(?:id|ref|key)$)(?:[a-z][a-z0-9]*_?)?(?:id|ref|key)$
          - pattern-either:
              - pattern: $R.update([$FIRST, ...], ...)
              - pattern: $R.delete([$FIRST, ...])
  - id: nestjs-ownership-request-key-to-criteria-local
    message: Request identifier reaches lookup/mutation or QueryBuilder criteria locally. Review the complete
      predicate and authorization path; this detector does not assert ownership is missing.
    severity: WARNING
    languages:
      - typescript
    metadata:
      category: security
      confidence: MEDIUM
      technology:
        - nestjs
        - typeorm
    mode: taint
    pattern-sources:
      - exact: true
        patterns:
          - pattern-either:
              - pattern: $REQ.params.$KEY
              - pattern: $REQ.query.$KEY
              - pattern: $REQ.body.$KEY
          - metavariable-regex:
              metavariable: $REQ
              regex: ^(?:req|request|context\.request|ctx\.request)$
          - metavariable-regex:
              metavariable: $KEY
              regex: (?i)^(?!(?:user|owner|principal)_?(?:id|ref|key)$)(?:[a-z][a-z0-9]*_?)?(?:id|ref|key)$
      - exact: true
        patterns:
          - pattern-inside: "import { Body as $DECORATOR } from \"@nestjs/common\";\n..."
          - pattern-inside: '$METHOD(..., @$DECORATOR() $INPUT: $TYPE, ...) { ... }'
          - pattern: $INPUT.$FIELD
          - metavariable-regex:
              metavariable: $FIELD
              regex: (?i)^(?!(?:user|owner|principal)_?(?:id|ref|key)$)(?:[a-z][a-z0-9]*_?)?(?:id|ref|key)$
      - exact: true
        patterns:
          - pattern-inside: "import { Body as $DECORATOR } from \"@nestjs/common\";\n..."
          - pattern: '$METHOD(..., @$DECORATOR($FIELD, ...) $INPUT: $TYPE, ...) { ... }'
          - metavariable-regex:
              metavariable: $FIELD
              regex:
                (?i)^['"](?!(?:user|owner|principal)_?(?:id|ref|key)['"]$)(?:[a-z][a-z0-9]*_?)?(?:id|ref|key)['"]$
          - focus-metavariable: $INPUT
      - exact: true
        patterns:
          - pattern-inside: "import { Body } from \"@nestjs/common\";\n..."
          - pattern-inside: '$METHOD(..., @Body() $INPUT: $TYPE, ...) { ... }'
          - pattern: $INPUT.$FIELD
          - metavariable-regex:
              metavariable: $FIELD
              regex: (?i)^(?!(?:user|owner|principal)_?(?:id|ref|key)$)(?:[a-z][a-z0-9]*_?)?(?:id|ref|key)$
      - exact: true
        patterns:
          - pattern-inside: "import { Body } from \"@nestjs/common\";\n..."
          - pattern: '$METHOD(..., @Body($FIELD, ...) $INPUT: $TYPE, ...) { ... }'
          - metavariable-regex:
              metavariable: $FIELD
              regex:
                (?i)^['"](?!(?:user|owner|principal)_?(?:id|ref|key)['"]$)(?:[a-z][a-z0-9]*_?)?(?:id|ref|key)['"]$
          - focus-metavariable: $INPUT
      - exact: true
        patterns:
          - pattern-inside: "import { Query as $DECORATOR } from \"@nestjs/common\";\n..."
          - pattern-inside: '$METHOD(..., @$DECORATOR() $INPUT: $TYPE, ...) { ... }'
          - pattern: $INPUT.$FIELD
          - metavariable-regex:
              metavariable: $FIELD
              regex: (?i)^(?!(?:user|owner|principal)_?(?:id|ref|key)$)(?:[a-z][a-z0-9]*_?)?(?:id|ref|key)$
      - exact: true
        patterns:
          - pattern-inside: "import { Query as $DECORATOR } from \"@nestjs/common\";\n..."
          - pattern: '$METHOD(..., @$DECORATOR($FIELD, ...) $INPUT: $TYPE, ...) { ... }'
          - metavariable-regex:
              metavariable: $FIELD
              regex:
                (?i)^['"](?!(?:user|owner|principal)_?(?:id|ref|key)['"]$)(?:[a-z][a-z0-9]*_?)?(?:id|ref|key)['"]$
          - focus-metavariable: $INPUT
      - exact: true
        patterns:
          - pattern-inside: "import { Query } from \"@nestjs/common\";\n..."
          - pattern-inside: '$METHOD(..., @Query() $INPUT: $TYPE, ...) { ... }'
          - pattern: $INPUT.$FIELD
          - metavariable-regex:
              metavariable: $FIELD
              regex: (?i)^(?!(?:user|owner|principal)_?(?:id|ref|key)$)(?:[a-z][a-z0-9]*_?)?(?:id|ref|key)$
      - exact: true
        patterns:
          - pattern-inside: "import { Query } from \"@nestjs/common\";\n..."
          - pattern: '$METHOD(..., @Query($FIELD, ...) $INPUT: $TYPE, ...) { ... }'
          - metavariable-regex:
              metavariable: $FIELD
              regex:
                (?i)^['"](?!(?:user|owner|principal)_?(?:id|ref|key)['"]$)(?:[a-z][a-z0-9]*_?)?(?:id|ref|key)['"]$
          - focus-metavariable: $INPUT
      - exact: true
        patterns:
          - pattern-inside: "import { Param as $DECORATOR } from \"@nestjs/common\";\n..."
          - pattern-inside: '$METHOD(..., @$DECORATOR() $INPUT: $TYPE, ...) { ... }'
          - pattern: $INPUT.$FIELD
          - metavariable-regex:
              metavariable: $FIELD
              regex: (?i)^(?!(?:user|owner|principal)_?(?:id|ref|key)$)(?:[a-z][a-z0-9]*_?)?(?:id|ref|key)$
      - exact: true
        patterns:
          - pattern-inside: "import { Param as $DECORATOR } from \"@nestjs/common\";\n..."
          - pattern: '$METHOD(..., @$DECORATOR($FIELD, ...) $INPUT: $TYPE, ...) { ... }'
          - metavariable-regex:
              metavariable: $FIELD
              regex:
                (?i)^['"](?!(?:user|owner|principal)_?(?:id|ref|key)['"]$)(?:[a-z][a-z0-9]*_?)?(?:id|ref|key)['"]$
          - focus-metavariable: $INPUT
      - exact: true
        patterns:
          - pattern-inside: "import { Param } from \"@nestjs/common\";\n..."
          - pattern-inside: '$METHOD(..., @Param() $INPUT: $TYPE, ...) { ... }'
          - pattern: $INPUT.$FIELD
          - metavariable-regex:
              metavariable: $FIELD
              regex: (?i)^(?!(?:user|owner|principal)_?(?:id|ref|key)$)(?:[a-z][a-z0-9]*_?)?(?:id|ref|key)$
      - exact: true
        patterns:
          - pattern-inside: "import { Param } from \"@nestjs/common\";\n..."
          - pattern: '$METHOD(..., @Param($FIELD, ...) $INPUT: $TYPE, ...) { ... }'
          - metavariable-regex:
              metavariable: $FIELD
              regex:
                (?i)^['"](?!(?:user|owner|principal)_?(?:id|ref|key)['"]$)(?:[a-z][a-z0-9]*_?)?(?:id|ref|key)['"]$
          - focus-metavariable: $INPUT
    pattern-sinks:
      - patterns:
          - pattern-either:
              - pattern: '$R.findOne({..., where: $CRITERIA, ...})'
              - pattern: '$R.findOneOrFail({..., where: $CRITERIA, ...})'
              - pattern: $R.findOneBy($CRITERIA)
              - pattern: $R.findOneByOrFail($CRITERIA)
              - pattern: $R.findBy($CRITERIA)
              - pattern: $R.update($CRITERIA, $DATA)
              - pattern: $R.delete($CRITERIA)
              - pattern: $QB.where($CRITERIA, ...)
              - pattern: $QB.andWhere($CRITERIA, ...)
              - pattern: $QB.orWhere($CRITERIA, ...)
              - pattern: $QB.whereInIds($CRITERIA)
              - pattern: $QB.andWhereInIds($CRITERIA)
          - focus-metavariable: $CRITERIA
      - patterns:
          - pattern-either:
              - pattern: $QB.where($SQL, $PARAMS)
              - pattern: $QB.andWhere($SQL, $PARAMS)
              - pattern: $QB.orWhere($SQL, $PARAMS)
          - focus-metavariable: $PARAMS

  - id: nestjs-ownership-dto-spread-persistence-review
    message: DTO/input/body-named data reaches a create/save/insert/update/merge-shaped method locally. Establish receiver and input provenance, actual persistence, allowed fields and overwrite order; service wrappers may write and names do not prove mass assignment.
    severity: WARNING
    languages:
      - typescript
    metadata:
      category: security
      confidence: LOW
      technology:
        - nestjs
        - typeorm
    mode: taint
    pattern-sources:
      - patterns:
          - pattern: $INPUT
          - metavariable-regex:
              metavariable: $INPUT
              regex: (?i)^(?:dto|input|body|[a-z][a-z0-9]*Dto)$
    pattern-sinks:
      - patterns:
          - pattern-either:
              - pattern: $R.create($DATA)
              - pattern: $R.save($DATA)
              - pattern: $R.insert($DATA)
              - pattern: $R.update($ID, $DATA)
              - pattern: $R.merge($ENTITY, $DATA)
              - pattern: $M.update($ENTITY, $ID, $DATA)
          - focus-metavariable: $DATA
  - id: nestjs-ownership-object-assign-write-review
    message: Object.assign target with DTO/input/body-named source is later saved locally. Review allowed fields and protected ownership fields.
    severity: WARNING
    languages:
      - typescript
    metadata:
      category: security
      confidence: LOW
      technology:
        - nestjs
        - typeorm
    patterns:
      - pattern-inside: Object.assign($TARGET, $INPUT, ...); ...
      - pattern-either:
          - pattern: $R.save($TARGET)
          - pattern: $R.insert($TARGET)
      - metavariable-regex:
          metavariable: $INPUT
          regex: (?i)^(?:dto|input|body|[a-z][a-z0-9]*Dto)$
  - id: nestjs-ownership-additional-criteria-review
    message: Identifier lookup/mutation has additional criteria. Review whether any predicate authoritatively binds the principal; extra status/type criteria alone do not establish ownership.
    severity: WARNING
    languages:
      - typescript
    metadata:
      category: security
      confidence: MEDIUM
      technology:
        - nestjs
        - typeorm
    patterns:
      - pattern-either:
          - pattern: '$R.findOne({..., where: {$KEY: $ID, $OTHER: $VALUE, ...}, ...})'
          - pattern: '$R.findOneOrFail({..., where: {$KEY: $ID, $OTHER: $VALUE, ...}, ...})'
          - pattern: '$R.findOneBy({$KEY: $ID, $OTHER: $VALUE, ...})'
          - pattern: '$R.findOneByOrFail({$KEY: $ID, $OTHER: $VALUE, ...})'
          - pattern: '$R.update({$KEY: $ID, $OTHER: $VALUE, ...}, ...)'
          - pattern: '$R.delete({$KEY: $ID, $OTHER: $VALUE, ...})'
      - metavariable-regex:
          metavariable: $KEY
          regex: (?i)^(?!(?:user|owner|principal)_?(?:id|ref|key)$)(?:[a-z][a-z0-9]*_?)?(?:id|ref|key)$
