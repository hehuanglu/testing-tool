  - id: nestjs-public-filesystem-path-usage
    message: Imported filesystem or response path API is used. For rename/copy/link distinguish
      source/existing path from destination/new path; inspect containment, symlinks and authorization.
    severity: WARNING
    languages:
      - typescript
    metadata:
      category: security
      confidence: MEDIUM
