  - id: config-compose-added-capability-review
    message: Compose adds a powerful capability. Review effective cap_drop, user namespace/rootless policy,
      seccomp and service need; added capability alone does not establish host compromise.
    severity: WARNING
    languages:
      - yaml
    metadata:
      category: security
      confidence: MEDIUM
      technology:
        - docker-compose
      p2_semantics: p2-manual-ce-2026-10-23
    paths:
      include:
        - '**/compose.yaml'
        - '**/compose.yml'
        - '**/docker-compose.yaml'
        - '**/docker-compose.yml'
    pattern-either:
      - patterns:
          - pattern: '{services: {..., $SERVICE: {..., cap_add: [..., $ITEM, ...], ...}, ...}, ...}'
          - metavariable-regex:
              metavariable: $ITEM
              regex: ^["\x27]?(?:ALL|SYS_ADMIN|SYS_PTRACE|NET_ADMIN|DAC_READ_SEARCH|DAC_OVERRIDE)["\x27]?$

  - id: config-compose-sensitive-host-bind-review
    message: Compose bind-mounts host root or an /etc, /proc, /sys or /dev path. Depending on permissions and
      read/write access this may expose host data/devices or permit modification; inspect effective isolation
      and mount mode.
    severity: WARNING
    languages:
      - yaml
    metadata:
      category: security
      confidence: MEDIUM
      technology:
        - docker-compose
      p2_semantics: p2-manual-ce-2026-10-23
    paths:
      include:
        - '**/compose.yaml'
        - '**/compose.yml'
        - '**/docker-compose.yaml'
        - '**/docker-compose.yml'
    pattern-either:
      - patterns:
          - pattern: '{services: {..., $SERVICE: {..., volumes: [..., $ITEM, ...], ...}, ...}, ...}'
          - metavariable-regex:
              metavariable: $ITEM
              regex: ^["\x27]?(?:/|/(?:etc|proc|sys|dev)(?:/[^:\s"\x27]*)?):[^\s"\x27]+["\x27]?$
      - patterns:
          - pattern: '{services: {..., $SERVICE: {..., volumes: [..., {type: bind, source: $SOURCE, ...}, ...],
              ...}, ...}, ...}'
          - metavariable-regex:
              metavariable: $SOURCE
              regex: ^["\x27]?(?:/|/(?:etc|proc|sys|dev)(?:/[^\s"\x27]*)?)["\x27]?$
