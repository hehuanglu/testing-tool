rules:
  - id: nestjs-public-dangerous-eval
    message: Public/backend code executes dynamic JavaScript. Remove eval-like execution or prove the input is fully trusted.
    severity: ERROR
    languages: [typescript]
    metadata:
      category: security
      confidence: HIGH
      technology: [nestjs, nodejs]
    pattern-either:
      - pattern: eval(...)
      - pattern: new Function(...)

  - id: nestjs-public-child-process-shell
    message: Imported child_process shell-capable API is used. Review command construction and effective shell
      options; usage alone does not establish untrusted flow.
