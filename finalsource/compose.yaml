name: security-vibe-coding

services:
  database:
    image: mysql:8.4
    command: ["--innodb-use-native-aio=0"]
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_PASSWORD:?Copy .env.example to .env and set MYSQL_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-vibe_security}
      MYSQL_USER: ${MYSQL_USER:-vibe_security}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s
    networks:
      - app_network

  backend:
    build:
      context: ./be
      dockerfile: Dockerfile
    restart: unless-stopped
    init: true
    environment:
      NODE_ENV: development
      PORT: 3000
      CORS_ORIGINS: https://localhost:${APP_PORT:-8080}
      DB_HOST: database
      DB_PORT: 3306
      DB_USERNAME: ${MYSQL_USER:-vibe_security}
      DB_PASSWORD: ${MYSQL_PASSWORD}
      DB_DATABASE: ${MYSQL_DATABASE:-vibe_security}
      JWT_SECRET: ${JWT_SECRET:?Copy .env.example to .env and set JWT_SECRET}
      JWT_EXPIRES_IN_SECONDS: ${JWT_EXPIRES_IN_SECONDS:-3600}
      JWT_ISSUER: ${JWT_ISSUER:-security-vibe-coding}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-security-vibe-coding-web}
      BCRYPT_COST: ${BCRYPT_COST:-12}
      LOGIN_MAX_ATTEMPTS: ${LOGIN_MAX_ATTEMPTS:-5}
      LOGIN_ATTEMPT_WINDOW_SECONDS: ${LOGIN_ATTEMPT_WINDOW_SECONDS:-900}
      LOGIN_LOCKOUT_SECONDS: ${LOGIN_LOCKOUT_SECONDS:-900}
      ACCOUNT_NUMBER_ENCRYPTION_KEY_BASE64: ${ACCOUNT_NUMBER_ENCRYPTION_KEY_BASE64:?Set a base64-encoded 32-byte encryption key}
      ACCOUNT_NUMBER_HMAC_KEY_BASE64: ${ACCOUNT_NUMBER_HMAC_KEY_BASE64:?Set a distinct base64-encoded 32-byte HMAC key}
      ACCOUNT_NUMBER_KEY_VERSION: ${ACCOUNT_NUMBER_KEY_VERSION:-1}
    depends_on:
      database:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    networks:
      - app_network

  frontend:
    build:
      context: ./fe
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    volumes:
      - ./.local-tls/localhost.crt:/etc/nginx/tls/localhost.crt:ro
      - ./.local-tls/localhost.key:/etc/nginx/tls/localhost.key:ro
    ports:
      - "127.0.0.1:${APP_PORT:-8080}:8443"
    networks:
      - app_network

volumes:
  mysql_data:

networks:
  app_network:
    driver: bridge
