interface:
  display_name: "MCP ZAP Repo Operations"
  short_description: "Assess a project against the fixed OWASP 2025 catalog"
  default_prompt: "Use $mcp-zap-repo-operations with the project and bundled 50-criterion OWASP 2025 catalog. Prepare a version 3 plan that records every criterion's selected decision and reason, mapped all_cases and concrete test approach, then obtain the single Gate 2 plan approval. The coordinator audits the preparation draft with situation-dependent questions and revisions, adapts authorized testing within the approved envelope, finishes every selected all_cases obligation using compatible evidence and local continuation, and delivers the agreed eleven-column Google Sheets table on Drive with explicit exclusions, risk counts, Only observed, evidence for each finding and explanatory notes."
