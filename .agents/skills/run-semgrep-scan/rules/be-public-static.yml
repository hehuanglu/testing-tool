  - id: nestjs-public-raw-query-string-construction
    message: Locally constructed SQL expression reaches query/execute SQL text. Bound values are separate; inspect external influence, constant folding and any allowlist before concluding injection.
    severity: WARNING
    languages: [typescript]
    metadata:
      category: security
      confidence: MEDIUM
      technology: [nestjs, typeorm]
      p1_semantics: p1-manual-ce-2026-10-23
    mode: taint
    pattern-sources:
      - pattern: $LEFT + $RIGHT
      - pattern: '`...${$VALUE}...`'
    pattern-sinks:
      - patterns:
          - pattern-either:
              - pattern: $DB.query($SQL, ...)
              - pattern: $DB.execute($SQL, ...)
          - focus-metavariable: $SQL
  - id: nestjs-public-request-body-mass-assignment
    message: Request-body-shaped data is supplied to entity construction/persistence. Review DTO allowlists, mutable fields and authoritative ownership; create/merge alone need not write data.
    severity: WARNING
    languages: [typescript]
    metadata:
      category: security
      confidence: MEDIUM
      technology: [nestjs, typeorm, express]
      p1_semantics: p1-manual-ce-2026-10-23
    pattern-either:
      - pattern: $REPO.create($REQ.body)
      - pattern: $REPO.save($REQ.body)
      - pattern: $REPO.update($ID, $REQ.body)
      - pattern: $REPO.merge($ENTITY, $REQ.body)

  - id: nestjs-public-sensitive-console-output
    message: Sensitive-named expression is passed to console. This is a usage signal; inspect actual value, redaction and enabled logging before concluding disclosure.
    severity: WARNING
    languages: [typescript]
    metadata:
      category: security
      confidence: LOW
      technology:
        - nestjs
        - nodejs
      p1_semantics: p1-manual-ce-2026-10-23
    patterns:
      - pattern-either:
          - pattern: console.log(..., $VALUE, ...)
          - pattern: console.error(..., $VALUE, ...)
          - pattern: console.warn(..., $VALUE, ...)
          - pattern: console.debug(..., $VALUE, ...)
      - metavariable-regex:
          metavariable: $VALUE
          regex: (?i).*(password|passwd|secret|token|authorization|cookie|accountnumber|account_number).*

  - id: nestjs-public-cors-wildcard
    message: CORS permits every origin. Use an explicit allowlist for trusted origins.
    severity: ERROR
    languages: [typescript]
    metadata:
      category: security
      confidence: HIGH
      technology: [nestjs]
    pattern-either:
      - pattern: '$APP.enableCors({..., origin: "*", ...})'
      - pattern: '$APP.enableCors({..., origin: true, ...})'
      - pattern: $APP.enableCors()

  - id: nestjs-public-validation-pipe-without-whitelist
    message: Global ValidationPipe does not visibly enable whitelist. Confirm unknown request fields are rejected or stripped.
    severity: WARNING
    languages: [typescript]
    metadata:
      category: security
      confidence: MEDIUM
      technology: [nestjs]
    patterns:
      - pattern: $APP.useGlobalPipes(new ValidationPipe($OPTIONS))
      - pattern-not: '$APP.useGlobalPipes(new ValidationPipe({..., whitelist: true, ...}))'

  - id: nestjs-public-validation-pipe-allows-unknown-fields
    message: Global ValidationPipe does not reject unknown fields. Enable forbidNonWhitelisted with whitelist for strict DTO input handling.
    severity: WARNING
    languages: [typescript]
    metadata:
      category: security
      confidence: MEDIUM
      technology: [nestjs]
    patterns:
      - pattern: $APP.useGlobalPipes(new ValidationPipe($OPTIONS))
      - pattern-not: '$APP.useGlobalPipes(new ValidationPipe({..., forbidNonWhitelisted: true, ...}))'

  - id: nestjs-public-internal-exception-disclosure
    message: Raw exception details are returned in an HTTP response. Use the centralized safe error envelope.
    severity: ERROR
    languages: [typescript]
    metadata:
      category: security
      confidence: HIGH
      technology: [nestjs, express]
    patterns:
      - pattern-either:
          - pattern: $RES.json($EXCEPTION)
          - pattern: $RES.send($EXCEPTION)
          - pattern: '$RES.json({..., error: $EXCEPTION, ...})'
          - pattern: '$RES.json({..., stack: $EXCEPTION.stack, ...})'
      - metavariable-regex:
          metavariable: $EXCEPTION
          regex: (?i)^(exception|error|err|caughtError)$

  - id: nestjs-public-swagger-without-environment-guard
    message: Swagger setup lacks a recognized direct non-production environment guard. Review enclosing conditions and deployment access; arbitrary if conditions do not prove an environment guard.
    severity: WARNING
    languages: [typescript]
    metadata:
      category: security
      confidence: MEDIUM
      technology: [nestjs, swagger]
      p1_semantics: p1-manual-ce-2026-10-23
    patterns:
      - pattern: SwaggerModule.setup(...)
      - pattern-not-inside: if (process.env.NODE_ENV !== 'production') { ... SwaggerModule.setup(...); ... }
      - pattern-not-inside: if (process.env.NODE_ENV != 'production') { ... SwaggerModule.setup(...); ... }
      - pattern-not-inside: if ($CONFIG.get('NODE_ENV') !== 'production') { ... SwaggerModule.setup(...); ... }
      - pattern-not-inside: if ($CONFIG.getOrThrow('NODE_ENV') !== 'production') { ... SwaggerModule.setup(...); ... }
      - pattern-not-inside: if ($CONFIG.get('app.nodeEnv') !== 'production') { ... SwaggerModule.setup(...); ... }
      - pattern-not-inside: if ($CONFIG.getOrThrow('app.nodeEnv') !== 'production') { ... SwaggerModule.setup(...); ... }
  - id: nestjs-public-exception-stack-in-http-error
    message: An exception stack is placed directly into an HTTP error. Return a generic safe message instead.
    severity: ERROR
    languages: [typescript]
    metadata:
      category: security
      confidence: HIGH
      technology: [nestjs]
    pattern-either:
      - pattern: 'throw new InternalServerErrorException($ERROR.stack)'
      - pattern: 'throw new HttpException($ERROR.stack, ...)'
  - id: nestjs-public-querybuilder-dynamic-sql-local
    message: Constructed expression reaches a QueryBuilder-style SQL clause or TypeORM Raw expression locally. Review API identity, external influence and parameter separation.
    severity: WARNING
    languages:
      - typescript
    metadata:
      category: security
      confidence: MEDIUM
      technology:
        - nestjs
        - typeorm
      p1_semantics: p1-manual-ce-2026-10-23
    mode: taint
    pattern-sources:
      - pattern: $LEFT + $RIGHT
      - pattern: '`...${$VALUE}...`'
    pattern-sinks:
      - patterns:
          - pattern-either:
              - pattern: $QB.where($SQL, ...)
              - pattern: $QB.andWhere($SQL, ...)
              - pattern: $QB.orWhere($SQL, ...)
              - pattern: $QB.orderBy($SQL, ...)
              - pattern: $QB.addOrderBy($SQL, ...)
              - pattern: Raw($SQL, ...)
          - focus-metavariable: $SQL
      - patterns:
          - pattern: Raw(($ALIAS) => $SQL, ...)
          - focus-metavariable: $SQL
      - patterns:
          - pattern-inside: Raw(($ALIAS) => { ... }, ...)
          - pattern: return $SQL
          - focus-metavariable: $SQL
      - patterns:
          - pattern: '$QB.set({..., $FIELD: () => $SQL, ...})'
          - focus-metavariable: $SQL
  - id: nestjs-public-request-to-sql-text-local
    message: Request-derived data reaches SQL text or a sort argument in the local function. Review
      validation, allowlists and bindings; request origin is not an exploit verdict.
    severity: WARNING
    languages:
      - typescript
    metadata:
      category: security
      confidence: MEDIUM
      technology:
        - nestjs
        - typeorm
      p1_semantics: p1-manual-ce-2026-10-23
    mode: taint
    pattern-sources:
      - patterns:
          - pattern-either:
              - pattern: $REQ.body
              - pattern: $REQ.query
              - pattern: $REQ.params
              - pattern: $REQ.headers
          - metavariable-regex:
              metavariable: $REQ
              regex: ^(?:req|request|context\.request|ctx\.request)$
      - patterns:
          - pattern-inside: "import { Body as $DECORATOR } from \"@nestjs/common\";\n..."
          - pattern: '$METHOD(..., @$DECORATOR(...) $INPUT: $TYPE, ...) { ... }'
          - focus-metavariable: $INPUT
      - patterns:
          - pattern-inside: "import { Body } from \"@nestjs/common\";\n..."
          - pattern: '$METHOD(..., @Body(...) $INPUT: $TYPE, ...) { ... }'
          - focus-metavariable: $INPUT
      - patterns:
          - pattern-inside: "import { Query as $DECORATOR } from \"@nestjs/common\";\n..."
          - pattern: '$METHOD(..., @$DECORATOR(...) $INPUT: $TYPE, ...) { ... }'
          - focus-metavariable: $INPUT
      - patterns:
          - pattern-inside: "import { Query } from \"@nestjs/common\";\n..."
          - pattern: '$METHOD(..., @Query(...) $INPUT: $TYPE, ...) { ... }'
          - focus-metavariable: $INPUT
      - patterns:
          - pattern-inside: "import { Param as $DECORATOR } from \"@nestjs/common\";\n..."
          - pattern: '$METHOD(..., @$DECORATOR(...) $INPUT: $TYPE, ...) { ... }'
          - focus-metavariable: $INPUT
      - patterns:
          - pattern-inside: "import { Param } from \"@nestjs/common\";\n..."
          - pattern: '$METHOD(..., @Param(...) $INPUT: $TYPE, ...) { ... }'
          - focus-metavariable: $INPUT
      - patterns:
          - pattern-inside: "import { Headers as $DECORATOR } from \"@nestjs/common\";\n..."
          - pattern: '$METHOD(..., @$DECORATOR(...) $INPUT: $TYPE, ...) { ... }'
          - focus-metavariable: $INPUT
      - patterns:
          - pattern-inside: "import { Headers } from \"@nestjs/common\";\n..."
          - pattern: '$METHOD(..., @Headers(...) $INPUT: $TYPE, ...) { ... }'
          - focus-metavariable: $INPUT
    pattern-sinks:
      - patterns:
          - pattern-either:
              - pattern: $DB.query($SQL, ...)
              - pattern: $DB.execute($SQL, ...)
              - pattern: $QB.where($SQL, ...)
              - pattern: $QB.andWhere($SQL, ...)
              - pattern: $QB.orWhere($SQL, ...)
              - pattern: $QB.orderBy($SQL, ...)
              - pattern: $QB.addOrderBy($SQL, ...)
              - pattern: Raw($SQL, ...)
          - focus-metavariable: $SQL
      - patterns:
          - pattern-either:
              - pattern: $QB.orderBy($COLUMN, $DIRECTION)
              - pattern: $QB.addOrderBy($COLUMN, $DIRECTION)
          - focus-metavariable: $DIRECTION

  - id: nestjs-public-sensitive-logger-usage
    message: Sensitive-named argument reaches a Nest Logger/logger-shaped API. Resolve the logger implementation and actual value/redaction before concluding sensitive logging.
    severity: WARNING
    languages:
      - typescript
    metadata:
      category: security
      confidence: LOW
      technology:
        - nestjs
        - nodejs
      p1_semantics: p1-manual-ce-2026-10-23
    patterns:
      - pattern: $LOGGER.$METHOD(..., $VALUE, ...)
      - metavariable-regex:
          metavariable: $LOGGER
          regex: ^(?:console|Logger|logger|this\.logger|this\.auditLogger)$
      - metavariable-regex:
          metavariable: $METHOD
          regex: ^(?:log|info|error|warn|debug|verbose|fatal|trace)$
      - metavariable-regex:
          metavariable: $VALUE
          regex: (?i).*(?:password|passphrase|passwd|secret|token|authorization|cookie|credential|account_?number).*
